      <text x="46" y="22" text-anchor="middle" fill="#a6f0e1">MariaDB</text>
    </g>
    <g transform="translate(690 278)">
      <rect width="112" height="34" rx="17" fill="#19c7a8" fill-opacity="0.16" stroke="#19c7a8" stroke-opacity="0.5"/>
      <text x="56" y="22" text-anchor="middle" fill="#a6f0e1">PostgreSQL</text>
    </g>
    <g transform="translate(812 278)">
      <rect width="98" height="34" rx="17" fill="#19c7a8" fill-opacity="0.16" stroke="#19c7a8" stroke-opacity="0.5"/>
      <text x="49" y="22" text-anchor="middle" fill="#a6f0e1">MongoDB</text>
    </g>
    <g transform="translate(920 278)">
