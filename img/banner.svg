      <text x="36" y="22" text-anchor="middle" fill="#a6f0e1">Redis</text>
    </g>
    <g transform="translate(248 322)">
      <rect width="104" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="52" y="22" text-anchor="middle" fill="#fcd38a">Minecraft</text>
    </g>
    <g transform="translate(362 322)">
      <rect width="104" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="52" y="22" text-anchor="middle" fill="#fcd38a">KI-Helfer</text>
    </g>
    <g transform="translate(476 322)">
      <rect width="120" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="60" y="22" text-anchor="middle" fill="#fcd38a">Livebetrieb</text>
    </g>
    <g transform="translate(606 322)">
      <rect width="108" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="54" y="22" text-anchor="middle" fill="#fcd38a">Mailserver</text>
    </g>
    <g transform="translate(724 322)">
      <rect width="88" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="44" y="22" text-anchor="middle" fill="#fcd38a">Docker</text>
    </g>
  </g>

  <!-- Status-Karte rechts -->
  <g transform="translate(1022 92)">
    <rect width="190" height="166" rx="18" fill="#161a28" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="18" y="32" font-size="13" font-weight="700" fill="#9aa3b8" letter-spacing="1">DIENSTE</text>
    <g font-size="14" fill="#e6e8f2">
      <circle cx="24" cy="58" r="5" fill="#22c55e"/><text x="38" y="63">Apache</text><text x="172" y="63" text-anchor="end" fill="#6b7280" font-size="12">:80</text>
      <circle cx="24" cy="86" r="5" fill="#22c55e"/><text x="38" y="91">MariaDB</text><text x="172" y="91" text-anchor="end" fill="#6b7280" font-size="12">:3306</text>
      <circle cx="24" cy="114" r="5" fill="#22c55e"/><text x="38" y="119">Survival</text><text x="172" y="119" text-anchor="end" fill="#6b7280" font-size="12">2 / 20</text>
      <circle cx="24" cy="142" r="5" fill="#7c5cff"/><text x="38" y="147">KI-Helfer</text><text x="172" y="147" text-anchor="end" fill="#6b7280" font-size="12">lokal</text>
    </g>
  </g>
</svg>
