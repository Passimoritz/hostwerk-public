<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#121626"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.55">
      <stop offset="0" stop-color="#19c7a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#19c7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#FFD2BE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow1)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(96 104) scale(0.21875)">
    <rect width="512" height="512" rx="112" fill="#FF5A1F"/>
    <rect x="128" y="116" width="84" height="280" rx="22" fill="#14181D"/>
    <rect x="300" y="116" width="84" height="280" rx="22" fill="#14181D"/>
    <polyline points="200,256 230,256 250,198 272,314 292,256 312,256" fill="none" stroke="#14181D" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Titel -->
  <text x="244" y="160" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Hostwerk</text>
  <text x="248" y="204" font-size="27" font-weight="600" fill="#e6e8f2">Die lokale Server-Zentrale für Windows und Linux</text>
  <text x="248" y="240" font-size="18" fill="#9aa3b8">Webserver · Datenbanken · Mail · Minecraft · KI – bis zum Livebetrieb</text>

  <!-- Chips -->
  <g font-size="15" font-weight="600">
    <g transform="translate(248 278)">
      <rect width="88" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="44" y="22" text-anchor="middle" fill="#cfc4ff">Apache</text>
    </g>
    <g transform="translate(346 278)">
      <rect width="74" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="37" y="22" text-anchor="middle" fill="#cfc4ff">nginx</text>
    </g>
    <g transform="translate(430 278)">
      <rect width="76" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="38" y="22" text-anchor="middle" fill="#cfc4ff">Caddy</text>
    </g>
    <g transform="translate(516 278)">
      <rect width="62" height="34" rx="17" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.5"/>
      <text x="31" y="22" text-anchor="middle" fill="#cfc4ff">PHP</text>
