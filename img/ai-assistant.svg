<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#121626"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#19c7a8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="680" rx="24" fill="url(#bg)"/>

  <!-- Fenster -->
  <rect x="32" y="32" width="1216" height="616" rx="18" fill="#10131d" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Chatliste -->
  <rect x="48" y="48" width="250" height="584" rx="14" fill="#151927"/>
  <rect x="62" y="62" width="222" height="36" rx="9" fill="url(#acc)"/>
  <text x="173" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">+ Neuer Chat</text>
  <g font-size="13">
    <rect x="58" y="114" width="230" height="52" rx="10" fill="#7c5cff" fill-opacity="0.18"/>
    <rect x="70" y="128" width="22" height="22" rx="6" fill="#7c5cff"/>
    <text x="102" y="138" font-weight="700" fill="#fff">Alle Dienste starten</text>
    <text x="102" y="156" font-size="11.5" fill="#9aa3b8">Allgemein · qwen3:14b</text>
    <rect x="70" y="182" width="22" height="22" rx="6" fill="#3e8cff"/>
    <text x="102" y="192" font-weight="700" fill="#e6e8f2">Spieler-Statistik</text>
    <text x="102" y="210" font-size="11.5" fill="#9aa3b8">Datenbank-Assistent</text>
    <rect x="70" y="234" width="22" height="22" rx="6" fill="#e5484d"/>
    <text x="102" y="244" font-weight="700" fill="#e6e8f2">nginx startet nicht</text>
    <text x="102" y="262" font-size="11.5" fill="#9aa3b8">Fehler-Doktor</text>
    <rect x="70" y="286" width="22" height="22" rx="6" fill="#23964a"/>
    <text x="102" y="296" font-weight="700" fill="#e6e8f2">Plugins gegen Lags</text>
    <text x="102" y="314" font-size="11.5" fill="#9aa3b8">Minecraft-Admin</text>
  </g>
  <g transform="translate(62 470)" font-size="12">
    <text fill="#7c86a3" font-weight="700" letter-spacing="1">MODI</text>
    <g transform="translate(0 14)">
      <rect width="104" height="26" rx="13" fill="#232842"/><text x="52" y="17" text-anchor="middle" fill="#cfd4e4">Allgemein</text>
      <rect x="112" width="110" height="26" rx="13" fill="#232842"/><text x="167" y="17" text-anchor="middle" fill="#cfd4e4">Fehler-Doktor</text>
      <rect y="34" width="104" height="26" rx="13" fill="#232842"/><text x="52" y="51" text-anchor="middle" fill="#cfd4e4">Datenbank</text>
      <rect x="112" y="34" width="110" height="26" rx="13" fill="#232842"/><text x="167" y="51" text-anchor="middle" fill="#cfd4e4">Minecraft</text>
      <rect y="68" width="104" height="26" rx="13" fill="#232842"/><text x="52" y="85" text-anchor="middle" fill="#cfd4e4">Web</text>
      <rect x="112" y="68" width="110" height="26" rx="13" fill="#232842"/><text x="167" y="85" text-anchor="middle" fill="#cfd4e4">Sicherheit</text>
    </g>
  </g>

  <!-- Chat-Kopf -->
  <rect x="314" y="48" width="918" height="52" rx="12" fill="#151927"/>
  <rect x="330" y="62" width="26" height="26" rx="8" fill="#7c5cff"/>
  <rect x="366" y="62" width="120" height="26" rx="7" fill="#1c2133"/><text x="378" y="80" font-size="13" fill="#e6e8f2">Allgemein ▾</text>
  <rect x="496" y="62" width="104" height="26" rx="13" fill="#1c2133" stroke="#ffffff" stroke-opacity="0.08"/><text x="548" y="80" text-anchor="middle" font-size="12" fill="#9aa3b8">⧉ Kontext</text>
  <rect x="1052" y="62" width="164" height="26" rx="7" fill="#1c2133"/><text x="1064" y="80" font-size="12.5" fill="#cfd4e4">Standard (qwen3:14b) ▾</text>

  <!-- Nachricht Nutzer -->
  <g transform="translate(0 124)">
    <rect x="760" y="0" width="420" height="44" rx="14" fill="#7c5cff" fill-opacity="0.22"/>
    <text x="780" y="28" font-size="14.5" fill="#fff">Starte bitte alle Dienste, die gerade aus sind.</text>
    <circle cx="1206" cy="22" r="15" fill="#232842"/><text x="1206" y="27" text-anchor="middle" font-size="13" fill="#9aa3b8">👤</text>
    <text x="1174" y="62" text-anchor="end" font-size="11" fill="#6b7280">14:02</text>
  </g>

  <!-- Schritte -->
  <g transform="translate(344 204)">
    <circle cx="0" cy="18" r="15" fill="#7c5cff" fill-opacity="0.25"/><text x="0" y="23" text-anchor="middle" font-size="13">🤖</text>
    <rect x="26" y="0" width="420" height="34" rx="10" fill="#151927" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="44" y="22" font-size="13" fill="#22c55e">✓</text>
    <text x="62" y="22" font-size="13" fill="#cfd4e4">2 Schritte</text>
    <text x="136" y="22" font-size="12.5" fill="#7c86a3">Dienste angesehen · Vorfälle gelesen</text>
  </g>

  <!-- Bestätigung -->
  <g transform="translate(370 254)">
    <rect width="560" height="150" rx="14" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.8"/>
    <text x="18" y="30" font-size="15" font-weight="700" fill="#fcd38a">⚠  Der Helfer möchte etwas ändern</text>
    <rect x="18" y="44" width="524" height="52" rx="9" fill="#0c0f17"/>
    <text x="32" y="66" font-size="13" fill="#e6e8f2" font-family="Cascadia Code, Consolas, monospace">Starten: PostgreSQL 17 (Datenbank), Redis (Datenbank),</text>
    <text x="32" y="86" font-size="13" fill="#e6e8f2" font-family="Cascadia Code, Consolas, monospace">nginx Shop (Webserver), Creative (Minecraft)</text>
    <rect x="18" y="108" width="112" height="30" rx="8" fill="#7c5cff"/><text x="74" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">✓ Ausführen</text>
    <rect x="140" y="108" width="112" height="30" rx="8" fill="#232842"/><text x="196" y="128" text-anchor="middle" font-size="13.5" fill="#cfd4e4">✕ Ablehnen</text>
    <text x="270" y="128" font-size="12" fill="#9aa3b8">eine Bestätigung für alles</text>
  </g>

  <!-- Antwort -->
  <g transform="translate(344 424)">
    <circle cx="0" cy="18" r="15" fill="#7c5cff" fill-opacity="0.25"/><text x="0" y="23" text-anchor="middle" font-size="13">🤖</text>
    <rect x="26" y="0" width="560" height="82" rx="14" fill="#161a28" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="44" y="28" font-size="14.5" fill="#e6e8f2">Fertig – PostgreSQL, Redis und Creative laufen jetzt.</text>
    <text x="44" y="50" font-size="14.5" fill="#e6e8f2">nginx meldet einen Port-Konflikt auf <tspan font-family="Cascadia Code, Consolas, monospace" fill="#c9c0ff">8081</tspan> – soll ich nachsehen?</text>
    <text x="44" y="72" font-size="11" fill="#6b7280">14:02 · qwen3:14b · ⧉ Kopieren · ↻ Neu</text>
  </g>

  <!-- Datei-Anhang + erzeugte Datei -->
  <g transform="translate(370 528)">
    <rect width="250" height="48" rx="12" fill="#151927" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="30" font-size="16">📄</text>
    <text x="44" y="22" font-size="13" font-weight="700" fill="#e6e8f2">spieler-top10.csv</text>
    <text x="44" y="38" font-size="11" fill="#9aa3b8">erzeugt · 2 KB · herunterladen</text>
    <rect x="262" width="250" height="48" rx="12" fill="#151927" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="278" y="30" font-size="16">🖼</text>
    <text x="306" y="22" font-size="13" font-weight="700" fill="#e6e8f2">fehler-screenshot.png</text>
    <text x="306" y="38" font-size="11" fill="#9aa3b8">angehängt per Strg+V</text>
  </g>

  <!-- Eingabe -->
  <rect x="314" y="590" width="918" height="42" rx="12" fill="#151927"/>
  <text x="336" y="616" font-size="15" fill="#9aa3b8">📎</text>
  <text x="364" y="616" font-size="14" fill="#6b7280">Nachricht an Allgemein … (Enter sendet)</text>
  <rect x="1124" y="598" width="96" height="28" rx="8" fill="url(#acc)"/><text x="1172" y="617" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Senden</text>

  <!-- Hinweise rechts -->
  <g transform="translate(958 254)" font-size="13">
    <rect width="258" height="302" rx="14" fill="#151927" stroke="#7c5cff" stroke-opacity="0.35"/>
    <text x="18" y="32" font-size="12" font-weight="700" fill="#c9c0ff" letter-spacing="1">DER HELFER KANN</text>
    <g fill="#cfd4e4">
      <text x="18" y="62">• Dienste, Protokolle, Vorfälle lesen</text>
      <text x="18" y="88">• Datenbanken abfragen</text>
      <text x="18" y="114">• Minecraft steuern, Plugins suchen</text>
      <text x="18" y="140">• Webseiten &amp; Dateien prüfen</text>
      <text x="18" y="166">• Dateien erzeugen (CSV, Code …)</text>
      <text x="18" y="192">• Anhänge &amp; Bilder verstehen</text>
      <text x="18" y="218">• allgemeine Fragen beantworten</text>
    </g>
    <line x1="18" y1="236" x2="240" y2="236" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="18" y="260" font-size="12.5" fill="#a6f0e1">Läuft lokal mit Ollama –</text>
    <text x="18" y="280" font-size="12.5" fill="#a6f0e1">nichts verlässt den PC.</text>
  </g>
</svg>
