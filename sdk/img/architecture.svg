<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset=".5" stop-color="#5f7bff"/><stop offset="1" stop-color="#19c7a8"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b4bacb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#19c7a8"/></marker>
  </defs>
  <rect width="960" height="430" rx="22" fill="#0a0c11"/>
  <text x="34" y="46" fill="#e7e9f0" font-size="21" font-weight="700">How an extension runs in Hostwerk</text>
  <text x="34" y="70" fill="#7d859b" font-size="13.5">The page lives in a sandbox. Everything goes through the bridge – Hostwerk checks permissions and asks before changes.</text>

  <!-- Hostwerk -->
  <rect x="34" y="96" width="300" height="300" rx="16" fill="#12151d" stroke="#232838"/>
  <rect x="34" y="96" width="300" height="44" rx="16" fill="#171b25"/>
  <rect x="34" y="124" width="300" height="16" fill="#171b25"/>
  <rect x="52" y="108" width="20" height="20" rx="6" fill="url(#acc)"/>
  <text x="82" y="123" fill="#e7e9f0" font-size="15" font-weight="700">Hostwerk</text>
  <g font-size="13" fill="#b4bacb">
    <text x="56" y="172">● Services, Minecraft, system …</text>
    <text x="56" y="198">● Colours · light/dark · font</text>
    <text x="56" y="224">● Language (German / English)</text>
    <text x="56" y="250">● Settings form (from manifest)</text>
    <text x="56" y="276">● Storage per extension (256 KB)</text>
  </g>
  <rect x="52" y="300" width="264" height="78" rx="12" fill="#1e2330"/>
  <text x="68" y="326" fill="#f5b84a" font-size="13" font-weight="700">Asks you first</text>
  <text x="68" y="348" fill="#b4bacb" font-size="12.5">“Status Wall wants to restart</text>
  <text x="68" y="366" fill="#b4bacb" font-size="12.5">Apache – allow?”</text>

  <!-- Bridge -->
  <rect x="384" y="150" width="192" height="190" rx="16" fill="#12151d" stroke="url(#acc)" stroke-width="2"/>
  <text x="480" y="182" fill="#e7e9f0" font-size="15" font-weight="700" text-anchor="middle">Bridge</text>
  <text x="480" y="202" fill="#7d859b" font-size="12" text-anchor="middle">postMessage</text>
  <g font-size="12.5" fill="#b4bacb" text-anchor="middle">
    <text x="480" y="236">checks permissions</text>
    <text x="480" y="258">read:minecraft ✓</text>
    <text x="480" y="280">control:services → ask</text>
    <text x="480" y="302">/settings ✗ never</text>
  </g>

  <!-- Extension -->
  <rect x="626" y="96" width="300" height="300" rx="16" fill="#12151d" stroke="#2d3446" stroke-dasharray="6 5"/>
  <text x="646" y="124" fill="#7d859b" font-size="12" font-weight="600" letter-spacing="1">SANDBOX · OWN ORIGIN</text>
  <rect x="646" y="138" width="260" height="40" rx="10" fill="#171b25"/>
  <rect x="660" y="150" width="16" height="16" rx="5" fill="#2fd39a"/>
  <text x="686" y="163" fill="#e7e9f0" font-size="13.5" font-weight="700">Your page / tile</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#b4a3ff">
    <text x="652" y="210">&lt;script src="/ext-sdk.js"&gt;</text>
    <text x="652" y="236">Hostwerk.services()</text>
    <text x="652" y="262">Hostwerk.html`…${name}`</text>
    <text x="652" y="288">Hostwerk.t('title')</text>
    <text x="652" y="314">Hostwerk.on('service', …)</text>
  </g>
  <g font-size="12" fill="#7d859b">
    <text x="652" y="346">class="hw-card hw-btn" · var(--hw-accent)</text>
    <text x="652" y="370">no cookies · no foreign scripts</text>
  </g>

  <!-- arrows -->
  <path d="M334 190 L384 190" stroke="#19c7a8" stroke-width="2.5" marker-end="url(#ag)"/>
  <path d="M576 190 L626 190" stroke="#19c7a8" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="480" y="132" fill="#19c7a8" font-size="12.5" text-anchor="middle">theme · language · settings · events →</text>
  <path d="M626 300 L576 300" stroke="#b4bacb" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M384 300 L334 300" stroke="#b4bacb" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="480" y="370" fill="#b4bacb" font-size="12.5" text-anchor="middle">← requests (get · post · storage · toast)</text>
</svg>
