<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1472" width="1200" height="1472" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="1472" rx="18" fill="#f8fafc"/><text x="28" y="48" font-size="26" font-weight="700" fill="#0f172a">What an extension may do – per permission</text><text x="28" y="76" font-size="15" fill="#475569">Permissions are listed in the package (manifest.json → permissions) and shown to you before installing.</text><rect x="28" y="96" width="6" height="22" rx="3" fill="#2563eb"/><text x="44" y="113" font-size="17" font-weight="700" fill="#2563eb">Read – no question asked</text><rect x="28" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="142" width="129.8" height="22" rx="6" fill="#dbeafe"/><text x="51" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:services</text><text x="42" y="186" font-size="14" fill="#1e293b">See services and their state</text><rect x="414" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="142" width="86.8" height="22" rx="6" fill="#dbeafe"/><text x="437" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:web</text><text x="428" y="186" font-size="14" fill="#1e293b">Read web servers</text><rect x="800" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="142" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="823" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:databases</text><text x="814" y="186" font-size="14" fill="#1e293b">Read database servers</text><rect x="28" y="207" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="219" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="51" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:minecraft</text><text x="42" y="263" font-size="14" fill="#1e293b">Read Minecraft servers, players and stats</text><rect x="414" y="207" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="219" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="437" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:apps</text><text x="428" y="263" font-size="14" fill="#1e293b">Read apps</text><rect x="800" y="207" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="219" width="104" height="22" rx="6" fill="#dbeafe"/><text x="823" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:tasks</text><text x="814" y="263" font-size="14" fill="#1e293b">Read scheduled tasks</text><rect x="28" y="284" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="296" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="51" y="312" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:mail</text><text x="42" y="340" font-size="14" fill="#1e293b">Read captured e-mails</text><rect x="414" y="284" width="372" height="82" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="296" width="112.6" height="22" rx="6" fill="#dbeafe"/><text x="437" y="312" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:system</text><text x="428" y="340" font-size="14" fill="#1e293b">Read system health, load, ports and storage</text><text x="428" y="359" font-size="14" fill="#1e293b">per service</text><rect x="800" y="284" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="296" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="823" y="312" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:live</text><text x="814" y="340" font-size="14" fill="#1e293b">Read certificates and uptime checks</text><rect x="28" y="380" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="392" width="121.19999999999999" height="22" rx="6" fill="#dbeafe"/><text x="51" y="408" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:network</text><text x="42" y="436" font-size="14" fill="#1e293b">Read router, machines and security status</text><rect x="414" y="380" width="372" height="101" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="392" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="437" y="408" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:knowledge</text><text x="428" y="436" font-size="14" fill="#1e293b">Read the knowledge graph: projects, graph,</text><text x="428" y="455" font-size="14" fill="#1e293b">report, question history, memory, Claude</text><text x="428" y="474" font-size="14" fill="#1e293b">status</text><rect x="800" y="380" width="372" height="101" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="392" width="112.6" height="22" rx="6" fill="#dbeafe"/><text x="823" y="408" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:claude</text><text x="814" y="436" font-size="14" fill="#1e293b">Read the AI connection: Claude status,</text><text x="814" y="455" font-size="14" fill="#1e293b">projects, memory (incl. what each AI gets),</text><text x="814" y="474" font-size="14" fill="#1e293b">token-saving tools, usage</text><rect x="28" y="511" width="6" height="22" rx="3" fill="#ea580c"/><text x="44" y="528" font-size="17" font-weight="700" fill="#ea580c">Change – Hostwerk asks every time</text><rect x="28" y="545" width="372" height="63" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="557" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="51" y="573" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">control:services</text><text x="42" y="601" font-size="14" fill="#1e293b">Start, stop, restart services (asks first)</text><rect x="414" y="545" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="557" width="164.2" height="22" rx="6" fill="#ffedd5"/><text x="437" y="573" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">command:minecraft</text><text x="428" y="601" font-size="14" fill="#1e293b">Send commands to Minecraft servers (asks</text><text x="428" y="620" font-size="14" fill="#1e293b">first)</text><rect x="800" y="545" width="372" height="63" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="557" width="95.39999999999999" height="22" rx="6" fill="#ffedd5"/><text x="823" y="573" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">run:tasks</text><text x="814" y="601" font-size="14" fill="#1e293b">Run scheduled tasks (asks first)</text><rect x="28" y="641" width="372" height="101" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="653" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="51" y="669" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:minecraft</text><text x="42" y="697" font-size="14" fill="#1e293b">Change Minecraft settings: server.properties,</text><text x="42" y="716" font-size="14" fill="#1e293b">game rules, icon, plugins on/off, create</text><text x="42" y="735" font-size="14" fill="#1e293b">backups (asks first)</text><rect x="414" y="641" width="372" height="63" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="653" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="437" y="669" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:databases</text><text x="428" y="697" font-size="14" fill="#1e293b">Create database backups (asks first)</text><rect x="800" y="641" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="653" width="112.6" height="22" rx="6" fill="#ffedd5"/><text x="823" y="669" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:mail</text><text x="814" y="697" font-size="14" fill="#1e293b">Send test mails to the mail catcher, mark</text><text x="814" y="716" font-size="14" fill="#1e293b">mails as read (asks first)</text><rect x="28" y="756" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="768" width="138.39999999999998" height="22" rx="6" fill="#ffedd5"/><text x="51" y="784" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">connect:claude</text><text x="42" y="812" font-size="14" fill="#1e293b">Connect Claude and forget it again (writes</text><text x="42" y="831" font-size="14" fill="#1e293b">marked sections into projects – asks first)</text><rect x="414" y="756" width="372" height="101" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="768" width="129.8" height="22" rx="6" fill="#ffedd5"/><text x="437" y="784" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:claude</text><text x="428" y="812" font-size="14" fill="#1e293b">Set up Claude: write context into project</text><text x="428" y="831" font-size="14" fill="#1e293b">files, install/remove token-saving tools,</text><text x="428" y="850" font-size="14" fill="#1e293b">settings (asks first)</text><rect x="800" y="756" width="372" height="101" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="768" width="121.19999999999999" height="22" rx="6" fill="#ffedd5"/><text x="823" y="784" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">share:status</text><text x="814" y="812" font-size="14" fill="#1e293b">Set up the public status page: on/off, title,</text><text x="814" y="831" font-size="14" fill="#1e293b">shown checks, renew link, place it into a</text><text x="814" y="850" font-size="14" fill="#1e293b">website (asks first)</text><rect x="28" y="887" width="6" height="22" rx="3" fill="#7c3aed"/><text x="44" y="904" font-size="17" font-weight="700" fill="#7c3aed">Change without asking (only that area’s own data)</text><rect x="28" y="921" width="372" height="82" rx="12" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/><rect x="42" y="933" width="155.6" height="22" rx="6" fill="#ede9fe"/><text x="51" y="949" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#7c3aed" font-weight="700">change:knowledge</text><text x="42" y="977" font-size="14" fill="#1e293b">Build and query the knowledge graph, add</text><text x="42" y="996" font-size="14" fill="#1e293b">folders, edit memory, Obsidian export</text><rect x="28" y="1033" width="6" height="22" rx="3" fill="#0d9488"/><text x="44" y="1050" font-size="17" font-weight="700" fill="#0d9488">Special permissions</text><rect x="28" y="1067" width="372" height="82" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="42" y="1079" width="121.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="51" y="1095" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">run:terminal</text><text x="42" y="1123" font-size="14" fill="#1e293b">Type commands into the Hostwerk terminal (you</text><text x="42" y="1142" font-size="14" fill="#1e293b">confirm with Enter or in a dialog first)</text><rect x="414" y="1067" width="372" height="63" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="428" y="1079" width="78.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="437" y="1095" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">storage</text><text x="428" y="1123" font-size="14" fill="#1e293b">Store own data (max. 256 KB)</text><rect x="800" y="1067" width="372" height="63" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="814" y="1079" width="78.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="823" y="1095" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">network</text><text x="814" y="1123" font-size="14" fill="#1e293b">Talk to the web addresses named in the package</text><rect x="28" y="1163" width="372" height="101" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="42" y="1175" width="69.6" height="22" rx="6" fill="#ccfbf1"/><text x="51" y="1191" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">native</text><text x="42" y="1219" font-size="14" fill="#1e293b">Own server code – runs sandboxed (official</text><text x="42" y="1238" font-size="14" fill="#1e293b">packages from the Hostwerk catalog as part of</text><text x="42" y="1257" font-size="14" fill="#1e293b">Hostwerk)</text><rect x="28" y="1294" width="1144" height="150" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><text x="46" y="1324" font-size="17" font-weight="700" fill="#b91c1c">⛔ Never possible – no permission unlocks this</text><text x="46" y="1352" font-size="14.5" fill="#7f1d1d">✕ Settings and login</text><text x="618" y="1352" font-size="14.5" fill="#7f1d1d">✕ Passwords and vaults</text><text x="46" y="1376" font-size="14.5" fill="#7f1d1d">✕ AI provider keys</text><text x="618" y="1376" font-size="14.5" fill="#7f1d1d">✕ Users, remote access, pairing keys</text><text x="46" y="1400" font-size="14.5" fill="#7f1d1d">✕ install/change other extensions</text><text x="618" y="1400" font-size="14.5" fill="#7f1d1d">✕ Files, terminal, commands (without permission)</text><text x="46" y="1424" font-size="14.5" fill="#7f1d1d">✕ read Hostwerk’s program folder and data</text><text x="618" y="1424" font-size="14.5" fill="#7f1d1d">✕ reach 127.0.0.1 or your home network</text></svg>
