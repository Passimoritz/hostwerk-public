<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1529" width="1200" height="1529" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"><rect width="1200" height="1529" rx="18" fill="#f8fafc"/><text x="28" y="48" font-size="26" font-weight="700" fill="#0f172a">Was eine Erweiterung darf – je Freigabe</text><text x="28" y="76" font-size="15" fill="#475569">Die Freigaben stehen im Paket (manifest.json → permissions) und werden dir vor dem Installieren gezeigt.</text><rect x="28" y="96" width="6" height="22" rx="3" fill="#2563eb"/><text x="44" y="113" font-size="17" font-weight="700" fill="#2563eb">Lesen – ohne Rückfrage</text><rect x="28" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="142" width="129.8" height="22" rx="6" fill="#dbeafe"/><text x="51" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:services</text><text x="42" y="186" font-size="14" fill="#1e293b">Dienste und ihren Zustand sehen</text><rect x="414" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="142" width="86.8" height="22" rx="6" fill="#dbeafe"/><text x="437" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:web</text><text x="428" y="186" font-size="14" fill="#1e293b">Webserver lesen</text><rect x="800" y="130" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="142" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="823" y="158" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:databases</text><text x="814" y="186" font-size="14" fill="#1e293b">Datenbankserver lesen</text><rect x="28" y="207" width="372" height="82" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="219" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="51" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:minecraft</text><text x="42" y="263" font-size="14" fill="#1e293b">Minecraft-Server, Spieler und Statistiken</text><text x="42" y="282" font-size="14" fill="#1e293b">lesen</text><rect x="414" y="207" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="219" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="437" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:apps</text><text x="428" y="263" font-size="14" fill="#1e293b">Apps lesen</text><rect x="800" y="207" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="219" width="104" height="22" rx="6" fill="#dbeafe"/><text x="823" y="235" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:tasks</text><text x="814" y="263" font-size="14" fill="#1e293b">Aufgaben lesen</text><rect x="28" y="303" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="315" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="51" y="331" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:mail</text><text x="42" y="359" font-size="14" fill="#1e293b">Abgefangene E-Mails lesen</text><rect x="414" y="303" width="372" height="82" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="315" width="112.6" height="22" rx="6" fill="#dbeafe"/><text x="437" y="331" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:system</text><text x="428" y="359" font-size="14" fill="#1e293b">Systemzustand, Auslastung, Ports und Speicher</text><text x="428" y="378" font-size="14" fill="#1e293b">je Dienst lesen</text><rect x="800" y="303" width="372" height="82" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="315" width="95.39999999999999" height="22" rx="6" fill="#dbeafe"/><text x="823" y="331" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:live</text><text x="814" y="359" font-size="14" fill="#1e293b">Zertifikate und Erreichbarkeit (Überwachung)</text><text x="814" y="378" font-size="14" fill="#1e293b">lesen</text><rect x="28" y="399" width="372" height="63" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="42" y="411" width="121.19999999999999" height="22" rx="6" fill="#dbeafe"/><text x="51" y="427" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:network</text><text x="42" y="455" font-size="14" fill="#1e293b">Router, Rechner und Sicherheitslage lesen</text><rect x="414" y="399" width="372" height="82" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="428" y="411" width="138.39999999999998" height="22" rx="6" fill="#dbeafe"/><text x="437" y="427" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:knowledge</text><text x="428" y="455" font-size="14" fill="#1e293b">Wissensgraph lesen: Projekte, Graph, Bericht,</text><text x="428" y="474" font-size="14" fill="#1e293b">Fragenverlauf, Gedächtnis, Claude-Status</text><rect x="800" y="399" width="372" height="101" rx="12" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/><rect x="814" y="411" width="112.6" height="22" rx="6" fill="#dbeafe"/><text x="823" y="427" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#2563eb" font-weight="700">read:claude</text><text x="814" y="455" font-size="14" fill="#1e293b">KI-Anbindung lesen: Claude-Status, Projekte,</text><text x="814" y="474" font-size="14" fill="#1e293b">Gedächtnis (auch was jede KI davon bekommt),</text><text x="814" y="493" font-size="14" fill="#1e293b">Spar-Werkzeuge, Verbrauch</text><rect x="28" y="530" width="6" height="22" rx="3" fill="#ea580c"/><text x="44" y="547" font-size="17" font-weight="700" fill="#ea580c">Ändern – Hostwerk fragt jedes Mal</text><rect x="28" y="564" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="576" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="51" y="592" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">control:services</text><text x="42" y="620" font-size="14" fill="#1e293b">Dienste starten, stoppen, neu starten (mit</text><text x="42" y="639" font-size="14" fill="#1e293b">Rückfrage)</text><rect x="414" y="564" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="576" width="164.2" height="22" rx="6" fill="#ffedd5"/><text x="437" y="592" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">command:minecraft</text><text x="428" y="620" font-size="14" fill="#1e293b">Befehle an Minecraft-Server senden (mit</text><text x="428" y="639" font-size="14" fill="#1e293b">Rückfrage)</text><rect x="800" y="564" width="372" height="63" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="576" width="95.39999999999999" height="22" rx="6" fill="#ffedd5"/><text x="823" y="592" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">run:tasks</text><text x="814" y="620" font-size="14" fill="#1e293b">Aufgaben ausführen (mit Rückfrage)</text><rect x="28" y="660" width="372" height="120" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="672" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="51" y="688" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:minecraft</text><text x="42" y="716" font-size="14" fill="#1e293b">Minecraft-Einstellungen ändern:</text><text x="42" y="735" font-size="14" fill="#1e293b">server.properties, Spielregeln, Symbol,</text><text x="42" y="754" font-size="14" fill="#1e293b">Plugins an/aus, Sicherung anlegen (mit</text><text x="42" y="773" font-size="14" fill="#1e293b">Rückfrage)</text><rect x="414" y="660" width="372" height="63" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="672" width="155.6" height="22" rx="6" fill="#ffedd5"/><text x="437" y="688" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:databases</text><text x="428" y="716" font-size="14" fill="#1e293b">Datenbank-Sicherungen anlegen (mit Rückfrage)</text><rect x="800" y="660" width="372" height="82" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="672" width="112.6" height="22" rx="6" fill="#ffedd5"/><text x="823" y="688" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:mail</text><text x="814" y="716" font-size="14" fill="#1e293b">Test-Mails in den Mail-Fänger schicken, Mails</text><text x="814" y="735" font-size="14" fill="#1e293b">als gelesen markieren (mit Rückfrage)</text><rect x="28" y="794" width="372" height="101" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="42" y="806" width="138.39999999999998" height="22" rx="6" fill="#ffedd5"/><text x="51" y="822" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">connect:claude</text><text x="42" y="850" font-size="14" fill="#1e293b">Claude einbinden und wieder vergessen</text><text x="42" y="869" font-size="14" fill="#1e293b">(schreibt markierte Abschnitte in Projekte –</text><text x="42" y="888" font-size="14" fill="#1e293b">mit Rückfrage)</text><rect x="414" y="794" width="372" height="120" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="428" y="806" width="129.8" height="22" rx="6" fill="#ffedd5"/><text x="437" y="822" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">change:claude</text><text x="428" y="850" font-size="14" fill="#1e293b">Claude einrichten: Kontext in Projekt-Dateien</text><text x="428" y="869" font-size="14" fill="#1e293b">schreiben, Spar-Werkzeuge</text><text x="428" y="888" font-size="14" fill="#1e293b">installieren/entfernen, Einstellungen (mit</text><text x="428" y="907" font-size="14" fill="#1e293b">Rückfrage)</text><rect x="800" y="794" width="372" height="101" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/><rect x="814" y="806" width="121.19999999999999" height="22" rx="6" fill="#ffedd5"/><text x="823" y="822" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#ea580c" font-weight="700">share:status</text><text x="814" y="850" font-size="14" fill="#1e293b">Öffentliche Statusseite einrichten: an/aus,</text><text x="814" y="869" font-size="14" fill="#1e293b">Titel, angezeigte Prüfungen, Link erneuern, in</text><text x="814" y="888" font-size="14" fill="#1e293b">eine Website legen (mit Rückfrage)</text><rect x="28" y="944" width="6" height="22" rx="3" fill="#7c3aed"/><text x="44" y="961" font-size="17" font-weight="700" fill="#7c3aed">Ändern ohne Rückfrage (nur eigene Daten des Bereichs)</text><rect x="28" y="978" width="372" height="82" rx="12" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/><rect x="42" y="990" width="155.6" height="22" rx="6" fill="#ede9fe"/><text x="51" y="1006" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#7c3aed" font-weight="700">change:knowledge</text><text x="42" y="1034" font-size="14" fill="#1e293b">Wissensgraph bauen und abfragen, Ordner</text><text x="42" y="1053" font-size="14" fill="#1e293b">aufnehmen, Gedächtnis pflegen, Obsidian-Export</text><rect x="28" y="1090" width="6" height="22" rx="3" fill="#0d9488"/><text x="44" y="1107" font-size="17" font-weight="700" fill="#0d9488">Besondere Rechte</text><rect x="28" y="1124" width="372" height="82" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="42" y="1136" width="121.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="51" y="1152" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">run:terminal</text><text x="42" y="1180" font-size="14" fill="#1e293b">Befehle ins Hostwerk-Terminal tippen (du</text><text x="42" y="1199" font-size="14" fill="#1e293b">bestätigst mit Enter bzw. vorher im Dialog)</text><rect x="414" y="1124" width="372" height="63" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="428" y="1136" width="78.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="437" y="1152" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">storage</text><text x="428" y="1180" font-size="14" fill="#1e293b">Eigene Daten speichern (max. 256 KB)</text><rect x="800" y="1124" width="372" height="82" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="814" y="1136" width="78.19999999999999" height="22" rx="6" fill="#ccfbf1"/><text x="823" y="1152" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">network</text><text x="814" y="1180" font-size="14" fill="#1e293b">Mit den im Paket genannten Webadressen</text><text x="814" y="1199" font-size="14" fill="#1e293b">sprechen</text><rect x="28" y="1220" width="372" height="101" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/><rect x="42" y="1232" width="69.6" height="22" rx="6" fill="#ccfbf1"/><text x="51" y="1248" font-size="13.5" font-family="Consolas, 'Cascadia Code', monospace" fill="#0d9488" font-weight="700">native</text><text x="42" y="1276" font-size="14" fill="#1e293b">Eigener Server-Code – läuft abgeschottet</text><text x="42" y="1295" font-size="14" fill="#1e293b">(offizielle Pakete aus dem Hostwerk-Katalog</text><text x="42" y="1314" font-size="14" fill="#1e293b">als Teil von Hostwerk)</text><rect x="28" y="1351" width="1144" height="150" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><text x="46" y="1381" font-size="17" font-weight="700" fill="#b91c1c">⛔ Nie möglich – kein Recht schaltet das frei</text><text x="46" y="1409" font-size="14.5" fill="#7f1d1d">✕ Einstellungen und Anmeldung</text><text x="618" y="1409" font-size="14.5" fill="#7f1d1d">✕ Passwörter und Tresore</text><text x="46" y="1433" font-size="14.5" fill="#7f1d1d">✕ Schlüssel der KI-Anbieter</text><text x="618" y="1433" font-size="14.5" fill="#7f1d1d">✕ Benutzer, Fernzugriff, Kopplungsschlüssel</text><text x="46" y="1457" font-size="14.5" fill="#7f1d1d">✕ andere Erweiterungen installieren/ändern</text><text x="618" y="1457" font-size="14.5" fill="#7f1d1d">✕ Dateien, Terminal, Befehle (ohne Freigabe)</text><text x="46" y="1481" font-size="14.5" fill="#7f1d1d">✕ Hostwerks Programmordner und Daten lesen</text><text x="618" y="1481" font-size="14.5" fill="#7f1d1d">✕ 127.0.0.1 und dein Heimnetz erreichen</text></svg>
