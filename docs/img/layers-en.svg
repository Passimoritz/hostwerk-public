<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 380" width="1340" height="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#94a3b8"/></marker></defs><rect width="1340" height="380" rx="18" fill="#f8fafc"/><text x="28" y="46" font-size="24" font-weight="700" fill="#0f172a">How Hostwerk checks every request of an extension</text><rect x="28" y="84" width="262" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="48" y="116" font-size="17" font-weight="700" fill="#0f172a">Extension</text><rect x="44" y="136" width="230" height="76" rx="10" fill="#f1f5f9"/><text x="58" y="166" font-size="15" font-weight="600" fill="#0f172a">Page in a frame</text><text x="58" y="190" font-size="12.5" fill="#475569">own origin, no login</text><rect x="44" y="228" width="230" height="76" rx="10" fill="#f1f5f9"/><text x="58" y="258" font-size="15" font-weight="600" fill="#0f172a">Server code</text><text x="58" y="282" font-size="12.5" fill="#475569">own process, own folder only</text><path d="M294 209 H330" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><rect x="336" y="110" width="146" height="198" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><rect x="336" y="110" width="146" height="8" rx="4" fill="#b91c1c"/><text x="350" y="146" font-size="12" font-weight="700" fill="#b91c1c">1.</text><text x="368" y="146" font-size="16" font-weight="700" fill="#0f172a">Block list</text><text x="350" y="176" font-size="13" fill="#334155">Settings, passwords,</text><text x="350" y="194" font-size="13" fill="#334155">keys, files … –</text><text x="350" y="212" font-size="13" fill="#334155">never, whatever the</text><text x="350" y="230" font-size="13" fill="#334155">permission</text><rect x="496" y="110" width="146" height="198" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="496" y="110" width="146" height="8" rx="4" fill="#2563eb"/><text x="510" y="146" font-size="12" font-weight="700" fill="#2563eb">2.</text><text x="528" y="146" font-size="16" font-weight="700" fill="#0f172a">Permissions</text><text x="510" y="176" font-size="13" fill="#334155">Only areas from</text><text x="510" y="194" font-size="13" fill="#334155">“permissions” in the</text><text x="510" y="212" font-size="13" fill="#334155">package</text><rect x="656" y="110" width="146" height="198" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><rect x="656" y="110" width="146" height="8" rx="4" fill="#ea580c"/><text x="670" y="146" font-size="12" font-weight="700" fill="#ea580c">3.</text><text x="688" y="146" font-size="16" font-weight="700" fill="#0f172a">Confirmation</text><text x="670" y="176" font-size="13" fill="#334155">You confirm every</text><text x="670" y="194" font-size="13" fill="#334155">change in Hostwerk</text><rect x="816" y="110" width="146" height="198" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="816" y="110" width="146" height="8" rx="4" fill="#7c3aed"/><text x="830" y="146" font-size="12" font-weight="700" fill="#7c3aed">4.</text><text x="848" y="146" font-size="16" font-weight="700" fill="#0f172a">Black out</text><text x="830" y="176" font-size="13" fill="#334155">Passwords, tokens,</text><text x="830" y="194" font-size="13" fill="#334155">keys in answers →</text><text x="830" y="212" font-size="13" fill="#334155">••••••</text><rect x="976" y="110" width="146" height="198" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><rect x="976" y="110" width="146" height="8" rx="4" fill="#0d9488"/><text x="990" y="146" font-size="12" font-weight="700" fill="#0d9488">5.</text><text x="1008" y="146" font-size="16" font-weight="700" fill="#0f172a">Log</text><text x="990" y="176" font-size="13" fill="#334155">Every access lands</text><text x="990" y="194" font-size="13" fill="#334155">in the access log</text><path d="M1126 209 H1158" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><rect x="1164" y="150" width="148" height="118" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/><text x="1178" y="190" font-size="16" font-weight="700" fill="#065f46">Hostwerk</text><text x="1178" y="214" font-size="12.5" fill="#065f46">only runs what</text><text x="1178" y="232" font-size="12.5" fill="#065f46">is allowed</text></svg>
