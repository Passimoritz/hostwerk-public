name: Erweiterung einreichen
description: Eine eigene Hostwerk-Erweiterung in den öffentlichen Katalog aufnehmen lassen
title: "Erweiterung: "
labels: [erweiterung]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Teilen! In Hostwerk unter **Apps → Erweiterungen → Marktplatz** bei deiner Erweiterung auf **„Einreichen“** tippen füllt dieses Formular aus.
        Reine Seiten werden automatisch geprüft und sofort aufgenommen. Erweiterungen mit **Dienst** (startet Programme auf dem PC) prüft jemand von Hand.
  - type: input
    id: kennung
    attributes:
      label: Kennung
      description: Die „id“ aus manifest.json (a–z, 0–9, -)
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: textarea
    id: beschreibung
    attributes:
      label: Beschreibung
      description: Was macht die Erweiterung? (ein, zwei Sätze)
  - type: input
    id: link
    attributes:
      label: Link zum Paket
      description: https-Link zum ZIP – z. B. der Teilen-Link aus Hostwerk (muss nur bis zur Prüfung erreichbar sein) oder ein GitHub-Release.
    validations:
      required: true
  - type: checkboxes
    id: ok
    attributes:
      label: Bestätigung
      options:
        - label: Ich darf das Paket veröffentlichen, und es enthält keine fremden Zugangsdaten.
          required: true
