name: Keepalive

# GitHub disables scheduled workflows of public repositories after 60 days without activity – then the extension
# catalog, ratings and compatibility runs silently stop. Once a month this run switches every workflow (itself included)
# on again through the API. That counts as activity without a commit. Hostwerk itself warns when the catalog is older
# than 7 days, in case this run was disabled anyway.
on:
  schedule:
    - cron: '41 6 9 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/workflows" --paginate --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | "\(.id) \(.state) \(.name)"')
          echo "$ids" | while read -r id state name; do
            [ -z "$id" ] && continue
            if gh api -X PUT "repos/$REPO/actions/workflows/$id/enable" >/dev/null; then echo "enabled: $name (was $state)"; else echo "::warning title=Keepalive::Could not enable workflow $name ($id)"; fi
          done
