name: Entwickler verifizieren

# Anträge „Als Entwickler verifizieren lassen“ (Label „verifizierung“). Entschieden wird von Hand:
#   Label „verifiziert“  → Antragsteller kommt in katalog/verifiziert.json, Issue wird geschlossen
#   Label „abgelehnt“    → freundliche Rückmeldung, Issue wird geschlossen
#   Label „entzogen“     → (auf einem beliebigen Issue zur Person) Eintrag wird entfernt
# Beim Öffnen prüft die Action nur, ob die genannten Erweiterungen wirklich von dieser Person im Katalog stehen.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  verifizierung:
    if: contains(github.event.issue.labels.*.name, 'verifizierung')
    runs-on: ubuntu-latest
    concurrency: katalog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Antrag vorprüfen oder Entscheidung umsetzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ github.event.issue.number }}
          WHO: ${{ github.event.issue.user.login }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          node -e '
            const fs = require("fs");
            const who = process.env.WHO.toLowerCase();
            const community = JSON.parse(fs.readFileSync("katalog/community.json", "utf8"));
            const mine = (Array.isArray(community) ? community : community.items || []).filter((x) => String(x.submitter || "").toLowerCase() === who);
            fs.writeFileSync("/tmp/mine.txt", mine.map((x) => x.id).join(", "));
          '
          MINE=$(cat /tmp/mine.txt)
          if [ "$ACTION" = "opened" ]; then
            if [ -z "$MINE" ]; then
              gh issue comment "$NR" --body "Danke! Unter @$WHO steht noch keine Erweiterung im Community-Katalog. Bitte erst eine Erweiterung einreichen – danach kannst du hier erneut beantragen."
              gh issue close "$NR"
            else
              gh label create braucht-pruefung --color FBCA04 2>/dev/null || true
              gh issue edit "$NR" --add-label braucht-pruefung
              gh issue comment "$NR" --body "Danke! Gefundene Erweiterungen von @$WHO: $MINE. Das Projekt schaut sich den Antrag an und meldet sich hier."
            fi
            exit 0
          fi
          if [ "$LABEL" = "verifiziert" ]; then
            node -e '
              const fs = require("fs"); const f = "katalog/verifiziert.json";
              const d = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : { entwickler: [] };
              const who = process.env.WHO;
              if (!d.entwickler.some((x) => String(x.login).toLowerCase() === who.toLowerCase())) d.entwickler.push({ login: who, seit: new Date().toISOString().slice(0, 10), issue: Number(process.env.NR) });
              fs.writeFileSync(f, JSON.stringify(d, null, 2) + "\n");
            '
            git config user.name "hostwerk-bot"; git config user.email "bot@users.noreply.github.com"
            git add katalog/verifiziert.json
            git diff --cached --quiet || (git commit -m "Verifiziert: @$WHO" && git push)
            gh issue comment "$NR" --body "✅ @$WHO ist jetzt **verifizierter Entwickler** – das Abzeichen erscheint in Hostwerk beim nächsten Laden des Marktplatzes."
            gh issue close "$NR"
          elif [ "$LABEL" = "abgelehnt" ]; then
            gh issue comment "$NR" --body "Danke für den Antrag – diesmal leider nicht. Gründe stehen im Kommentar darüber; ein neuer Antrag ist später jederzeit möglich."
            gh issue close "$NR"
          elif [ "$LABEL" = "entzogen" ]; then
            node -e '
              const fs = require("fs"); const f = "katalog/verifiziert.json";
              if (!fs.existsSync(f)) process.exit(0);
              const d = JSON.parse(fs.readFileSync(f, "utf8"));
              d.entwickler = d.entwickler.filter((x) => String(x.login).toLowerCase() !== process.env.WHO.toLowerCase());
              fs.writeFileSync(f, JSON.stringify(d, null, 2) + "\n");
            '
            git config user.name "hostwerk-bot"; git config user.email "bot@users.noreply.github.com"
            git add katalog/verifiziert.json
            git diff --cached --quiet || (git commit -m "Verifizierung entzogen: @$WHO" && git push)
            gh issue comment "$NR" --body "Die Verifizierung von @$WHO wurde entzogen."
          fi
